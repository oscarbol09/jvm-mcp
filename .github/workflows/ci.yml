name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Static Application Security Testing (SAST) & Secret Leak Prevention
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for Secret Leaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Static Application Security Testing (SAST)
        run: pipx install semgrep && semgrep scan --config "p/java" --config "p/owasp-top-ten" --error

  # ---------------------------------------------------------------------------
  # Job 2: Multi-Platform Compilation, Test Suite & Coverage Matrix
  # ---------------------------------------------------------------------------
  test-matrix:
    name: Build & Test (${{ matrix.os }} - JDK ${{ matrix.java }})
    needs: [security-audit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['21']
    env:
      MAVEN_OPTS: >-
        -Dhttp.keepAlive=false
        -Dmaven.wagon.http.pool=false
        -Dmaven.wagon.http.retryHandler.count=3
        -Dmaven.wagon.http.retryHandler.requestSentEnabled=true
        -Daether.connector.http.retryHandler.count=3
        -Daether.connector.connectTimeout=30000
        -Daether.connector.requestTimeout=60000
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5.0.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Docker image for Postgres
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/docker-cache
          key: docker-postgres-15-alpine-v1

      - name: Preload or Pull Postgres Docker Image
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p /tmp/docker-cache
          IMAGE="postgres:15-alpine"
          FALLBACK="public.ecr.aws/docker/library/postgres:15-alpine"
          ARCHIVE="/tmp/docker-cache/postgres-15-alpine.tar"
          if [ -f "$ARCHIVE" ]; then
            echo "Loading cached Docker image from $ARCHIVE..."
            docker load -i "$ARCHIVE"
          else
            echo "Cache miss. Pulling Docker image: $IMAGE..."
            docker pull "$IMAGE" || docker pull "$FALLBACK"
            if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
              docker tag "$FALLBACK" "$IMAGE"
            fi
            docker save "$IMAGE" -o "$ARCHIVE"
          fi
          docker tag "$IMAGE" "$FALLBACK" 2>/dev/null || true

      - name: Compile, Test & Verify Monorepo
        shell: bash
        run: ./mvnw clean install -B --fail-fast

      - name: Run Pitest Mutation Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        shell: bash
        run: ./mvnw org.pitest:pitest-maven:mutationCoverage -B


      - name: Generate JaCoCo Coverage Summary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo "### 📊 JaCoCo Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Covered Instructions | Total Instructions | Coverage Ratio |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for csv in core/target/site/jacoco/jacoco.csv mcp-server/target/site/jacoco/jacoco.csv; do
            if [ -f "$csv" ]; then
              module=$(echo "$csv" | cut -d'/' -f1)
              total_missed=$(awk -F',' 'NR>1 {missed+=$4} END {print missed}' "$csv")
              total_covered=$(awk -F',' 'NR>1 {covered+=$5} END {print covered}' "$csv")
              total=$((total_missed + total_covered))
              if [ "$total" -gt 0 ]; then
                pct=$(awk "BEGIN {printf \"%.2f\", ($total_covered/$total)*100}")
                echo "| \`$module\` | $total_covered | $total | **$pct%** |" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done

      - name: Upload JaCoCo Coverage Reports
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.4.0
        with:
          name: jacoco-coverage-reports
          path: |
            core/target/site/jacoco/
            mcp-server/target/site/jacoco/
          retention-days: 14




