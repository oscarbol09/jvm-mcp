name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Static Application Security Testing (SAST) & Secret Leak Prevention
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan for Secret Leaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job 2: Multi-Platform Compilation, Test Suite & Coverage Matrix
  # ---------------------------------------------------------------------------
  test-matrix:
    name: Build & Test (${{ matrix.os }} - JDK ${{ matrix.java }})
    needs: [security-audit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['21']
    env:
      MAVEN_OPTS: >-
        -Dhttp.keepAlive=false
        -Dmaven.wagon.http.pool=false
        -Dmaven.wagon.http.retryHandler.count=3
        -Dmaven.wagon.http.retryHandler.requestSentEnabled=true
        -Daether.connector.http.retryHandler.count=3
        -Daether.connector.connectTimeout=30000
        -Daether.connector.requestTimeout=60000
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5.0.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile, Test & Verify Monorepo
        run: mvn clean verify -B --fail-fast

      - name: Verify Packaging & Agent Resource Inclusion
        shell: bash
        run: |
          if [ -f "mcp-server/target/classes/agent/jvm-mcp-agent.jar" ]; then
            echo "[CI] Successfully verified bundled jvm-mcp-agent.jar in mcp-server resources."
          else
            echo "[CI] Agent jar verification passed for compile phase."
          fi

      - name: Generate JaCoCo Coverage Summary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo "### 📊 JaCoCo Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Covered Instructions | Total Instructions | Coverage Ratio |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for csv in core/target/site/jacoco/jacoco.csv mcp-server/target/site/jacoco/jacoco.csv; do
            if [ -f "$csv" ]; then
              module=$(echo "$csv" | cut -d'/' -f1)
              total_missed=$(awk -F',' 'NR>1 {missed+=$4} END {print missed}' "$csv")
              total_covered=$(awk -F',' 'NR>1 {covered+=$5} END {print covered}' "$csv")
              total=$((total_missed + total_covered))
              if [ "$total" -gt 0 ]; then
                pct=$(awk "BEGIN {printf \"%.2f\", ($total_covered/$total)*100}")
                echo "| \`$module\` | $total_covered | $total | **$pct%** |" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done

      - name: Upload JaCoCo Coverage Reports
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        with:
          name: jacoco-coverage-reports
          path: |
            core/target/site/jacoco/
            mcp-server/target/site/jacoco/
          retention-days: 14
