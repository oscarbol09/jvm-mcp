name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-amd64
          - os: macos-latest
            suffix: macos-aarch64
          - os: windows-latest
            suffix: windows-amd64
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Fat JAR
        run: ./mvnw clean package -B 

      - name: Build Native Executable with jpackage
        shell: bash
        run: |
          # Use jlink and jpackage to bundle the JRE and Attach API
          jlink --add-modules java.base,java.management,java.net.http,java.sql,java.naming,jdk.attach,jdk.management,jdk.management.agent,java.instrument,jdk.internal.jvmstat --output custom-jre --strip-debug --no-man-pages --no-header-files
          
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            jpackage --type app-image --name jvm-mcp --input mcp-server/target --main-jar jvm-mcp-server-1.0.0-SNAPSHOT.jar --main-class dev.jvmmcp.JvmMcp --runtime-image custom-jre --dest build-out
            cd build-out
            7z a jvm-mcp-${{ matrix.suffix }}.zip jvm-mcp
            cd ..
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            mkdir -p dist
            cp -r custom-jre dist/
            cp mcp-server/target/jvm-mcp-server-*.jar dist/app.jar
            echo '#!/bin/bash' > dist/jvm-mcp-${{ matrix.suffix }}
            echo 'DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" &> /dev/null && pwd )"' >> dist/jvm-mcp-${{ matrix.suffix }}
            echo 'exec "$DIR/custom-jre/bin/java" -jar "$DIR/app.jar" "$@"' >> dist/jvm-mcp-${{ matrix.suffix }}
            chmod +x dist/jvm-mcp-${{ matrix.suffix }}
            tar -czvf jvm-mcp-${{ matrix.suffix }}.tar.gz -C dist .
          else
            # Linux
            mkdir -p dist
            cp -r custom-jre dist/
            cp mcp-server/target/jvm-mcp-server-*.jar dist/app.jar
            echo '#!/bin/bash' > dist/jvm-mcp-${{ matrix.suffix }}
            echo 'DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" &> /dev/null && pwd )"' >> dist/jvm-mcp-${{ matrix.suffix }}
            echo 'exec "$DIR/custom-jre/bin/java" -jar "$DIR/app.jar" "$@"' >> dist/jvm-mcp-${{ matrix.suffix }}
            chmod +x dist/jvm-mcp-${{ matrix.suffix }}
            tar -czvf jvm-mcp-${{ matrix.suffix }}.tar.gz -C dist .
          fi

      - name: Verify Executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p verify_app
          tar -xzf jvm-mcp-${{ matrix.suffix }}.tar.gz -C verify_app
          # On macOS/Linux, the tar contains a bin/java folder and jvm-mcp executable
          # Let's run it using the script inside the current directory
          ./verify_app/jvm-mcp-${{ matrix.suffix }} --version
          echo "Linux/macOS binary verified successfully."

      - name: Verify Executable (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $binaryPath = "build-out\jvm-mcp\jvm-mcp.exe"
          $process = Start-Process -FilePath $binaryPath -ArgumentList "--version" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            Write-Error "Executable failed with exit code $($process.ExitCode)"
            exit 1
          }
          Write-Host "Windows app-image verified successfully."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            jvm-mcp-*.tar.gz
            build-out/jvm-mcp-*.zip
